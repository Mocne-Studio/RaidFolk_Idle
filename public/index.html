<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#100E0C">
<title>RaidFolk Idle</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="start" class="start">
  <h1>RaidFolk Idle</h1>
  <p class="sub">Wieża · wersja testowa 0.1</p>

  <h2 class="maker-title">Wybierz swoje logo</h2>

  <div class="maker">
    <div class="maker-preview">
      <div id="crestPreview"></div>
      <div class="maker-name" id="crestName">—</div>
    </div>
    <div class="maker-controls">
      <div class="sec">Imię</div>
      <input type="text" id="name" maxlength="20" placeholder="Halgar" autocomplete="off">
      <button class="btn ghost wide" id="roll" style="margin-top:8px">Losuj herb</button>
    </div>
  </div>

  <div class="sec">Kształt</div>
  <div class="picker" id="pickShape"></div>

  <div class="sec">Symbol</div>
  <div class="picker" id="pickSymbol"></div>

  <div class="sec">Kolor środka</div>
  <div class="picker colors" id="pickColor"></div>

  <div class="sec">Kolor obramowania</div>
  <div class="picker colors" id="pickBorder"></div>

  <div class="sec">Kolor symbolu</div>
  <div class="picker colors" id="pickInk"></div>

  <button class="btn solid big wide" id="create" style="margin-top:16px">Wejdź do wieży</button>

  <div class="sec" style="margin-top:24px">Masz już postać?</div>
  <div class="card">
    <div class="t2" style="margin-bottom:9px">Wklej kod postaci, jeśli grasz z innego adresu albo z innego urządzenia. Kod znajdziesz w grze, w zakładce Postać.</div>
    <input type="text" id="code" maxlength="40" placeholder="kod postaci" autocomplete="off" spellcheck="false">
    <button class="btn wide" id="restore" style="margin-top:9px">Wczytaj postać</button>
  </div>
</div>

<!-- Nie ma tu wprowadzenia ani wyboru klasy. Herb → imię → gra, bez przystanków.
     Główna postać NIE MA KLASY — klasy należą do Sojuszników. -->

<div id="app" hidden>
  <!-- Cały pasek jest przyciskiem: herb i nick prowadzą do karty postaci,
       bo Postać i Drzewko zeszły spod głównej nawigacji pod profil. -->
  <button class="topbar" data-act="tab" data-tab="postac">
    <div id="hdrCrest" class="hdr-crest"></div>
    <div class="who">
      <div class="n" id="hdrName">—</div>
      <div class="m" id="hdrMeta">—</div>
    </div>
    <div class="purse" id="hdrPurse">—</div>
  </button>

  <div class="screens">
    <section class="screen on" id="s-wyprawa"></section>
    <section class="screen"    id="s-druzyna"></section>
    <section class="screen"    id="s-eq"></section>
    <section class="screen"    id="s-skille"></section>
    <section class="screen"    id="s-summon"></section>
    <section class="screen"    id="s-kronika"></section>
    <section class="screen"    id="s-postac"></section>
  </div>

  <!-- Stały pasek walki. Widoczny na każdej zakładce, dopóki coś się bije. -->
  <div id="combatbar" class="combatbar" hidden></div>

  <nav class="tabs">
    <button data-tab="wyprawa" aria-selected="true"><span class="ic">⚔</span><span class="tx">WYPRAWA</span></button>
    <button data-tab="druzyna" aria-selected="false"><span class="ic">👥</span><span class="tx">DRUŻYNA</span></button>
    <button data-tab="eq"      aria-selected="false"><span class="ic">🎒</span><span class="tx">EKWIPUNEK</span></button>
    <button data-tab="skille"  aria-selected="false"><span class="ic">⛏</span><span class="tx">SKILLE</span></button>
    <button data-tab="summon"  aria-selected="false"><span class="ic">✦</span><span class="tx">PRZYWOŁANIE</span></button>
    <button data-tab="kronika" aria-selected="false"><span class="ic">📖</span><span class="tx">KRONIKA</span></button>
  </nav>
</div>

<script type="module" src="/app.js"></script>
</body>
</html>
