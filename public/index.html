<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#100E0C">
<title>RaidFolk Idle</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="start" class="start">
  <h1>RaidFolk Idle</h1>
  <p class="sub">Wieża · wersja testowa 0.1</p>

  <h2 class="maker-title">Wybierz swoje logo</h2>

  <div class="maker">
    <div class="maker-preview">
      <div id="crestPreview"></div>
      <div class="maker-name" id="crestName">—</div>
    </div>
    <div class="maker-controls">
      <div class="sec">Imię</div>
      <input type="text" id="name" maxlength="20" placeholder="Halgar" autocomplete="off">
      <button class="btn ghost wide" id="roll" style="margin-top:8px">Losuj herb</button>
    </div>
  </div>

  <div class="sec">Kształt</div>
  <div class="picker" id="pickShape"></div>

  <div class="sec">Symbol</div>
  <div class="picker" id="pickSymbol"></div>

  <div class="sec">Kolor środka</div>
  <div class="picker colors" id="pickColor"></div>

  <div class="sec">Kolor obramowania</div>
  <div class="picker colors" id="pickBorder"></div>

  <div class="sec">Kolor symbolu</div>
  <div class="picker colors" id="pickInk"></div>

  <button class="btn solid big wide" id="create" style="margin-top:16px">Wejdź do wieży</button>

  <div class="sec" style="margin-top:24px">Masz już postać?</div>
  <div class="card">
    <div class="t2" style="margin-bottom:9px">Wklej kod postaci, jeśli grasz z innego adresu albo z innego urządzenia. Kod znajdziesz w grze, w zakładce Postać.</div>
    <input type="text" id="code" maxlength="40" placeholder="kod postaci" autocomplete="off" spellcheck="false">
    <button class="btn wide" id="restore" style="margin-top:9px">Wczytaj postać</button>
  </div>
</div>

<!-- Nie ma tu wprowadzenia ani wyboru klasy. Herb → imię → gra, bez przystanków.
     Główna postać NIE MA KLASY — klasy należą do Sojuszników. -->

<div id="app" hidden>
  <!-- GÓRNY PASEK. NIE jest już jednym <button>: w środku muszą stać klikalne
       rzeczy (przerwanie zbierania), a przycisk w przycisku to nieprawidłowy HTML.
       Przy okazji znika na dobre domyślna ramka przeglądarki, która robiła
       jasny obrys wokół belki.
       Trzy strefy: KTO (herb, imię, poziom) — CO SIĘ DZIEJE (rzeczy w tle)
       — CO MASZ (pozycja w rankingu, złoto, klucze). -->
  <div class="topbar">
    <button class="hdr-kto" data-act="tab" data-tab="postac"
            title="Twoja karta postaci — herb, opis o sobie, pełny ranking i ustawienia gry">
      <div id="hdrCrest" class="hdr-crest"></div>
      <div class="who">
        <div class="n" id="hdrName">—</div>
        <div class="m" id="hdrMeta">—</div>
      </div>
    </button>
    <div class="hdr-akt" id="hdrAkt"></div>
    <div class="hdr-boxy" id="hdrBoxy"></div>
  </div>

  <div class="screens">
    <section class="screen on" id="s-wyprawa"></section>
    <section class="screen"    id="s-druzyna"></section>
    <section class="screen"    id="s-eq"></section>
    <section class="screen"    id="s-skille"></section>
    <section class="screen"    id="s-summon"></section>
    <section class="screen"    id="s-kronika"></section>
    <section class="screen"    id="s-postac"></section>
  </div>

  <!-- Stały pasek walki. Widoczny na każdej zakładce, dopóki coś się bije. -->
  <div id="combatbar" class="combatbar" hidden></div>

  <nav class="tabs">
    <!-- IKONY JAKO WEKTORY, WKLEJONE W STRONę.
         Najpierw były emoji — część kolorowych (plecak, księga, głowy), część
         jednobarwnych (miecz, kilof) — więc zestaw wyglądał jak zbiór przypadków
         i połowa ikon ignorowała motyw, bo miała własne kolory.
         Ikon z CDN-u Google świadomie NIE bierzemy: projekt trzyma zero zależności
         runtime, a gra chodzi przez tunel z laptopa — ikony z obcego serwera
         znikałyby przy słabym połączeniu. Te są w pliku, więc są zawsze.
         Rysowane jednym obrysem `currentColor`, więc barwią się razem z zakładką
         i wyglądają identycznie w każdym z pięciu motywów. -->
    <button data-tab="wyprawa" aria-selected="true" title="Przygody — Wieża, Wyprawy, Dungeony i bossowie drużynowi — wszystko, co się bije" aria-label="Przygody"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"/><line x1="13" x2="19" y1="19" y2="13"/><line x1="16" x2="20" y1="16" y2="20"/><line x1="19" x2="21" y1="21" y2="19"/><polyline points="14.5 6.5 18 3 21 3 21 6 17.5 9.5"/><line x1="5" x2="9" y1="14" y2="18"/><line x1="7" x2="4" y1="17" y2="20"/><line x1="3" x2="5" y1="19" y2="21"/></svg></span><span class="tx">PRZYGODY</span></button>
    <button data-tab="druzyna" aria-selected="false" title="Drużyna — Bohater, sojusznik i pet — skład, który wchodzi z Tobą do walki" aria-label="Drużyna"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 21a8 8 0 0 0-16 0"/><circle cx="10" cy="8" r="5"/><path d="M22 20c0-3.37-2-6.5-4-8a5 5 0 0 0-.45-8.3"/></svg></span><span class="tx">DRUŻYNA</span></button>
    <button data-tab="eq"      aria-selected="false" title="Ekwipunek — Osiem slotów, plecak i porównanie „nosisz kontra bierzesz”" aria-label="Ekwipunek"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="M9 12h6"/><path d="M12 9v6"/></svg></span><span class="tx">EKWIPUNEK</span></button>
    <button data-tab="skille"  aria-selected="false" title="Skille — Profesje zbierackie, skille bojowe i rozdawanie atrybutów" aria-label="Skille"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="4.5" r="2.5"/><path d="m10.2 6.3-3.9 3.9"/><circle cx="4.5" cy="12" r="2.5"/><path d="M7 12h10"/><circle cx="19.5" cy="12" r="2.5"/><path d="m13.8 17.7 3.9-3.9"/><circle cx="12" cy="19.5" r="2.5"/></svg></span><span class="tx">SKILLE</span></button>
    <button data-tab="summon"  aria-selected="false" title="Przywołanie — Losowanie sojuszników i petów kluczami — szanse są jawne" aria-label="Przywołanie"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 11a2 2 0 1 1-4 0 4 4 0 0 1 8 0 6 6 0 0 1-12 0 8 8 0 0 1 16 0 10 10 0 1 1-20 0 11.93 11.93 0 0 1 2.42-7.22 2 2 0 1 1 3.16 2.44"/></svg></span><span class="tx">PRZYWOŁANIE</span></button>
    <button data-tab="kronika" aria-selected="false" title="Kronika — Bestiariusz, trofea, osiągnięcia i historia postaci" aria-label="Kronika"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a2.5 2.5 0 0 1 0-5H20"/><circle cx="12" cy="9" r="3"/><path d="m14.2 11.2 2 2"/></svg></span><span class="tx">KRONIKA</span></button>
  </nav>
</div>

<script type="module" src="/app.js"></script>
</body>
</html>
